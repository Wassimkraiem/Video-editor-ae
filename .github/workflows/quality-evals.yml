name: quality-evals

on:
  pull_request:
    paths:
      - "services/worker/**"
      - "skills/**"
      - "evals/**"
      - "scripts/run_quality_eval.py"
      - ".github/workflows/quality-evals.yml"
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,api]"
      - run: pytest
      - name: Export OpenAPI contract
        run: python scripts/export_openapi.py
      - name: Validate fixed eval set
        run: |
          python scripts/run_quality_eval.py --out quality-eval-results.json
        continue-on-error: true
      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: quality-eval-results
          path: quality-eval-results.json
