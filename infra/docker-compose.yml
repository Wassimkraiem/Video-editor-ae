services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: video
      POSTGRES_USER: video
      POSTGRES_PASSWORD: video
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video -d video"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://video:video@postgres:5432/video
      STORAGE_ROOT: /work/storage
      PROJECTS_ROOT: /work/projects
    volumes: ["studio-storage:/work/storage", "project-work:/work/projects"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ..
      dockerfile: infra/worker.Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://video:video@postgres:5432/video
      STORAGE_ROOT: /work/storage
      PROJECTS_ROOT: /work/projects
      # Preinstalled faster-whisper models (fw-large-v3, ...), read-only.
      WHISPER_MODELS_DIR: /models
      WHISPER_OFFLINE: "1"
      # HyperFrames Studio (hand-editing timeline) is forwarded on 3400-3409.
      STUDIO_PUBLIC_BIND: 0.0.0.0
      STUDIO_PUBLIC_HOST: localhost
      STUDIO_FIRST_PORT: "3400"
      STUDIO_SLOTS: "10"
    ports: ["3400-3409:3400-3409"]
    volumes:
      - studio-storage:/work/storage
      - project-work:/work/projects
      # Host folder that holds fw-large-v3: WHISPER_MODELS_HOST_DIR if set,
      # else the user's ~/.cache (USERPROFILE on Windows, HOME elsewhere), so
      # it works even when compose runs without --env-file.
      - ${WHISPER_MODELS_HOST_DIR:-${USERPROFILE:-${HOME:-}}/.cache}:/models:ro
      # Claude Code keeps SDK sessions here; a volume lets a reply resume a
      # run even after the worker container is recreated.
      - agent-sessions:/home/app/.claude
    depends_on:
      postgres: {condition: service_healthy}
      sandbox: {condition: service_started}

  web:
    build:
      context: ../apps/web
      dockerfile: ../../infra/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}

  sandbox:
    build:
      context: ..
      dockerfile: infra/sandbox/Dockerfile
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command: ["sleep", "infinity"]

volumes:
  agent-sessions:
  postgres-data:
  studio-storage:
  project-work:
