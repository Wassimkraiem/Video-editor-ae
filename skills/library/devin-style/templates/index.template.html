<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Devin Sans = Montserrat Black for Latin, Cairo Black for Arabic (same family, unicode-range) */
      @font-face { font-family: "Devin Sans"; src: url("assets/fonts/montserrat-latin-900.woff2") format("woff2"); font-weight: 900; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
      @font-face { font-family: "Devin Sans"; src: url("assets/fonts/montserrat-latin-ext-900.woff2") format("woff2"); font-weight: 900; font-display: block; unicode-range: U+0100-024F, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF; }
      @font-face { font-family: "Devin Sans"; src: url("assets/fonts/cairo-arabic-900.woff2") format("woff2"); font-weight: 900; font-display: block; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
      @font-face { font-family: "Devin Pixel"; src: url("assets/fonts/silkscreen-latin-700.woff2") format("woff2"); font-weight: 700; font-display: block; }
      /* Apple look: Inter ~ SF Pro for Latin, IBM Plex Sans Arabic for Arabic */
      @font-face { font-family: "Apple Sans"; src: url("assets/fonts/inter-latin-700.woff2") format("woff2"); font-weight: 700; font-display: block; unicode-range: U+0000-024F, U+2000-206F, U+20AC, U+2122; }
      @font-face { font-family: "Apple Sans"; src: url("assets/fonts/plex-arabic-700.woff2") format("woff2"); font-weight: 700; font-display: block; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
      @font-face { font-family: "UI Sans"; src: url("assets/fonts/inter-latin-600.woff2") format("woff2"); font-weight: 600; font-display: block; }
      @font-face { font-family: "UI Sans"; src: url("assets/fonts/inter-latin-400.woff2") format("woff2"); font-weight: 400; font-display: block; }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      .full { position: absolute; inset: 0; }

      /* ---------- set: plate → backlight glow → relit speaker ---------- */
      #plate-wrap { transform-origin: 50% 35%; }
      #plate { width: 100%; height: 100%; object-fit: cover; display: block; }
      #glow { --glow: #ff2b2b; opacity: 0;
        background:
          radial-gradient(ellipse 62% 30% at 50% var(--head-y, 30%), color-mix(in srgb, var(--glow) 70%, transparent) 0%, transparent 100%),
          radial-gradient(ellipse 95% 55% at 50% calc(var(--head-y, 30%) + 8%), color-mix(in srgb, var(--glow) 32%, transparent) 0%, transparent 100%);
        mix-blend-mode: screen; filter: blur(30px); }
      #cam { transform-origin: 50% 32%; }
      #subject-wrap { filter: drop-shadow(0 0 1.5px rgba(255, 238, 214, 0.55)) drop-shadow(0 0 26px rgba(130, 165, 255, 0.16)); }
      #subject { width: 100%; height: 100%; object-fit: cover; display: block; }

      /* desk + vignette, above the speaker, under every graphic */
      #grade { pointer-events: none;
        background:
          linear-gradient(180deg, transparent 70%, rgba(3, 4, 6, 0.9) 80%, #020203 87%, #020203 100%),
          radial-gradient(ellipse 85% 70% at 50% 40%, transparent 55%, rgba(0, 0, 0, 0.55) 100%); }

      /* ---------- captions ---------- */
      #captions { pointer-events: none; }
      .cap { position: absolute; left: 40px; right: 40px; top: var(--cap-y, 1010px); opacity: 0;
        display: flex; flex-direction: column; align-items: center; }
      .cap-line { display: block; font-family: "Devin Sans", sans-serif; font-weight: 900; font-size: 84px;
        line-height: 0.98; letter-spacing: -0.01em; text-transform: uppercase; color: #fff; text-align: center;
        white-space: nowrap;
        text-shadow: 0 0 22px rgba(255, 255, 255, 0.38), 0 0 4px rgba(255, 255, 255, 0.35), 0 4px 14px rgba(0, 0, 0, 0.6); }
      .cap.hook .cap-line { font-size: 104px; }
      .cap.pixel .cap-line { font-family: "Devin Pixel", monospace; font-weight: 700; letter-spacing: 0.02em; }
      .cap-line .k { color: var(--kc); text-shadow: 0 0 18px var(--kc), 0 0 46px var(--kc), 0 4px 14px rgba(0, 0, 0, 0.55); }
      .cap-line[dir="rtl"] { letter-spacing: 0; }
      .cap-line .k + .k { margin-inline-start: 0.1em; }

      /* ---------- Apple look (edit/style.json {"look": "apple"}) ---------- */
      .apple .cap-line { font-family: "Apple Sans", sans-serif; font-weight: 700; font-size: 70px; line-height: 1.12;
        letter-spacing: -0.015em; text-transform: none;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85), 0 0 18px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 0, 0, 0.35); }
      .apple .cap.hook .cap-line { font-size: 84px; }
      /* frosted pill behind each caption so white text reads on light clothes / walls */
      .apple .cap.pill { left: 0; right: 0; margin: 0 auto; width: fit-content; max-width: 1000px; padding: 12px 38px 18px;
        border-radius: 40px; background: rgba(16, 16, 22, 0.5);
        backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
        border: 1.5px solid rgba(255, 255, 255, 0.22); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 12px 32px rgba(0, 0, 0, 0.25); }
      .apple .cap-line .k { text-shadow: 0 0 14px color-mix(in srgb, var(--kc) 55%, transparent), 0 2px 10px rgba(0, 0, 0, 0.5); }
      .apple .glass, .apple .trow, .apple .notify, .apple .comment .field {
        background: linear-gradient(140deg, rgba(255,255,255,.26) 0%, rgba(255,255,255,.07) 45%, rgba(255,255,255,.14) 100%), rgba(18,18,22,.34);
        backdrop-filter: blur(22px) saturate(175%) brightness(.92); -webkit-backdrop-filter: blur(22px) saturate(175%) brightness(.92);
        border: 1.5px solid rgba(255,255,255,.42);
        box-shadow: inset 0 1.5px 0 rgba(255,255,255,.7), inset 0 -1px 0 rgba(255,255,255,.18), inset 0 0 28px rgba(255,255,255,.1), 0 16px 40px rgba(0,0,0,.28);
        text-shadow: 0 1px 8px rgba(0,0,0,.35); }
      .apple .glass li { color: #fff; border-left-color: rgba(255,255,255,.6); }

      /* ---------- kinetic (style "kineticWords" + "kinetic" beats) ---------- */
      .kw-mask { display: inline-block; overflow: hidden; padding: 0.06em 0.04em 0.2em; margin: -0.06em -0.04em -0.2em; vertical-align: bottom; }
      .kw { display: inline-block; }
      .kin { position: absolute; left: 0; right: 0; opacity: 0; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
      .kin-shade { position: absolute; left: -10%; right: -10%; top: -30%; bottom: -30%;
        background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(0, 0, 0, 0.42), transparent 75%); }
      .kin-icon { position: relative; width: 96px; height: 96px; margin-bottom: 10px; fill: none; stroke: var(--kc); stroke-width: 1.8;
        stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 12px color-mix(in srgb, var(--kc) 60%, transparent)) drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
      .kin-icon path { stroke-dasharray: 1; stroke-dashoffset: 1; }
      .kin-line { position: relative; display: block; text-align: center; white-space: nowrap; font-family: "Apple Sans", "Devin Sans", sans-serif;
        font-weight: 700; font-size: 92px; line-height: 1.12; color: #fff;
        text-shadow: 0 3px 14px rgba(0, 0, 0, 0.65), 0 0 30px rgba(0, 0, 0, 0.35); }
      .kin-line.big { font-size: 132px; color: var(--kc); text-shadow: 0 0 22px color-mix(in srgb, var(--kc) 55%, transparent), 0 4px 16px rgba(0, 0, 0, 0.6); }
      .kin-line.small { font-size: 64px; }
      .kin-ch { display: inline-block; }

      /* ---------- overlays ---------- */
      #overlays { pointer-events: none; }
      .glass { position: absolute; left: 110px; right: 110px; opacity: 0; border-radius: 34px; padding: 44px 46px;
        background: linear-gradient(180deg, rgba(44, 44, 50, 0.92), rgba(24, 24, 28, 0.92));
        border: 1.5px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        font-family: "UI Sans", sans-serif; color: #fff; }
      .glass h3 { font-weight: 600; font-size: 46px; text-align: center; margin-bottom: 26px; }
      .glass li { list-style: none; font-weight: 400; font-size: 34px; color: rgba(255, 255, 255, 0.82); padding: 10px 0 10px 26px; border-left: 4px solid rgba(160, 120, 255, 0.7); margin: 12px 0; }
      .glass img { display: block; width: 100%; border-radius: 18px; margin-top: 18px; }
      .media { position: absolute; opacity: 0; border-radius: 40px; overflow: hidden;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.75), 0 0 0 2px rgba(255, 255, 255, 0.12); background: #111; }
      .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .media .views { position: absolute; left: 26px; bottom: 22px; font-family: "UI Sans", sans-serif; font-weight: 600;
        font-size: 38px; color: #fff; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7); }
      .media .title { position: absolute; left: 20px; right: 20px; top: 34px; text-align: center; font-family: "Devin Sans", sans-serif;
        font-weight: 900; font-size: 50px; line-height: 1.05; color: #fff; text-shadow: 0 3px 12px rgba(0, 0, 0, 0.8); }
      .toggles { position: absolute; left: 120px; right: 120px; opacity: 0; font-family: "UI Sans", sans-serif; }
      .trow { display: flex; align-items: center; justify-content: space-between; height: 92px; padding: 0 30px; margin: 14px 0;
        border-radius: 20px; background: rgba(30, 32, 38, 0.9); border: 2px solid rgba(255, 255, 255, 0.08); color: #fff;
        font-weight: 600; font-size: 38px; }
      .sw { position: relative; width: 104px; height: 60px; border-radius: 30px; background: #3a3d45; }
      .sw i { position: absolute; top: 6px; left: 6px; width: 48px; height: 48px; border-radius: 50%; background: #fff; }
      .tap { position: absolute; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; opacity: 0;
        background: radial-gradient(circle, rgba(120, 190, 255, 0.95) 0 34%, rgba(77, 163, 255, 0.35) 36% 100%);
        box-shadow: 0 0 30px rgba(77, 163, 255, 0.9); }
      .comment { position: absolute; left: 90px; right: 90px; height: 116px; opacity: 0; display: flex; align-items: center; gap: 22px; }
      .comment .av { width: 92px; height: 92px; border-radius: 50%; background: linear-gradient(135deg, #ffd36b, #ff7a59); border: 3px solid #fff; flex: none; overflow: hidden; }
      .comment .av img { width: 100%; height: 100%; object-fit: cover; }
      .comment .field { flex: 1; height: 100px; border-radius: 50px; background: rgba(40, 42, 50, 0.92); border: 2px solid rgba(255, 255, 255, 0.16);
        display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 36px;
        font-family: "UI Sans", sans-serif; font-weight: 600; font-size: 48px; color: #fff; }
      .comment .send { width: 76px; height: 76px; border-radius: 50%; background: #6c63ff; display: flex; align-items: center; justify-content: center; }
      .notify { position: absolute; left: 50px; right: 50px; top: 90px; height: 150px; opacity: 0; border-radius: 40px; display: flex; align-items: center; gap: 26px; padding: 0 34px;
        background: rgba(38, 38, 44, 0.94); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); font-family: "UI Sans", sans-serif; color: #fff; }
      .notify .ic { width: 86px; height: 86px; border-radius: 22px; flex: none; background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5); }
      .notify b { display: block; font-weight: 600; font-size: 36px; }
      .notify span { display: block; font-weight: 400; font-size: 32px; color: rgba(255, 255, 255, 0.75); }
      .notify em { position: absolute; right: 36px; top: 30px; font-style: normal; font-size: 28px; color: rgba(255, 255, 255, 0.5); }
      .save { position: absolute; left: 0; right: 0; opacity: 0; display: flex; flex-direction: column; align-items: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920">
      <div id="world" class="full">
        <div id="plate-wrap" class="full"><img id="plate" src="__PLATE__" alt=""></div>
        <div id="glow" class="full"></div>
        <div id="cam" class="full">
          <div id="subject-wrap" class="full">
            <video id="subject" src="assets/subject.webm" muted playsinline data-start="0" data-duration="__DURATION__" data-track-index="0"></video>
          </div>
        </div>
        <div id="grade" class="full"></div>
      </div>

      <!-- b-roll videos must be static elements (the framework finds media at load). Example:
      <div id="broll-1" class="media" style="left:170px;top:330px;width:740px;height:1100px">
        <video src="assets/broll1.mp4" muted playsinline data-start="12.4" data-duration="2.6" data-track-index="5"></video>
      </div>
      and a beat {"type":"media","id":"broll-1","t":12.4,"dur":2.6} to animate it in/out. -->

      <div id="overlays" class="full"></div>
      <div id="captions" class="full"></div>

      <audio id="voice" src="assets/voice.wav" data-start="0" data-duration="__DURATION__" data-track-index="2" data-volume="1"></audio>
      <audio id="sfx" src="assets/audio/sfx.wav" data-start="0" data-duration="__DURATION__" data-track-index="3" data-volume="0.7"></audio>
      <!--__MUSIC__-->
    </div>

    <script>
      const D = __DURATION__;
      const CAPS = /*__CAPS__*/[];
      const BEATS = /*__BEATS__*/[];
      const SUBJ = /*__SUBJECT__*/{};
      const STYLE = /*__STYLE__*/{};
      const COLORS = { red: "#ff2b2b", green: "#29ff5e", yellow: "#ffe327", blue: "#2bb0ff", purple: "#b14bff", pink: "#ff4fd8", orange: "#ff8a1f", white: "#ffffff" };
      const $ = (id) => document.getElementById(id);
      const col = (c) => COLORS[c] || c || COLORS.red;
      const tl = gsap.timeline({ paused: true });
      const APPLE = STYLE.look === "apple";
      if (APPLE) {
        document.getElementById("root").classList.add("apple");
        Object.assign(COLORS, { red: "#ff453a", green: "#30d158", yellow: "#ffd60a", blue: "#0a84ff", purple: "#bf5af2", pink: "#ff375f", orange: "#ff9f0a" });
      }
      if (STYLE.bg === "original") {  // keep the footage's own background: no plate, no wall wash, no rim
        $("plate-wrap").style.display = "none";
        $("glow").style.display = "none";
        $("subject-wrap").style.filter = "none";
        $("grade").style.background = "radial-gradient(ellipse 90% 75% at 50% 42%, transparent 60%, rgba(0,0,0,0.35) 100%)";
        STYLE.autoFlash = false;
      }

      const headY = SUBJ.head_y || 0.28;
      document.getElementById("root").style.setProperty("--head-y", (headY * 100).toFixed(1) + "%");
      const capY = Math.round(1920 * Math.min(0.68, Math.max(0.47, (SUBJ.chest_y || 0.52) + (STYLE.capOffset || 0))));

      // ---------- captions: hard swaps, 2-frame pop, keyword line glows ----------
      const hidden = [];  // [start, end] windows where a beat owns the screen
      BEATS.forEach((b) => { if (["card", "toggles", "save", "kinetic"].includes(b.type) && b.captions !== true) hidden.push([b.t, b.t + b.dur]); });
      const isHidden = (s, e) => hidden.some(([a, z]) => Math.min(e, z) - Math.max(s, a) > 0.5 * (e - s));
      const hookEnd = (BEATS.find((b) => b.type === "hook") || { until: 0 }).until;
      const rtl = /[؀-ۿ]/;
      const capRoot = $("captions");
      CAPS.forEach((c, i) => {
        if (isHidden(c.s, c.e)) return;
        const el = document.createElement("div");
        el.className = "cap" + (c.s < hookEnd ? " hook" : "") + (STYLE.captionFont === "pixel" ? " pixel" : "") + (STYLE.capPill ? " pill" : "");
        el.id = "cap-" + i;
        el.style.setProperty("--cap-y", capY + "px");
        el.style.setProperty("--kc", col(c.key));
        const kwords = [];
        c.lines.forEach((ln) => {
          const line = document.createElement("div");
          line.className = "cap-line";
          if (ln.some((w) => rtl.test(w.t))) line.setAttribute("dir", "rtl");
          ln.forEach((w, wi) => {
            if (wi) line.appendChild(document.createTextNode(" "));  // space outside the span: inline-block keywords would swallow it
            const sp = document.createElement("span");
            if (w.k) { sp.className = "k"; sp.style.display = "inline-block"; }
            if (STYLE.kineticWords) {
              const m = document.createElement("span"); m.className = "kw-mask";
              const inner = document.createElement("span"); inner.className = "kw"; inner.textContent = w.t;
              m.appendChild(inner); sp.appendChild(m);
              kwords.push([inner, w.s == null ? c.s : Math.max(c.s, w.s)]);
            } else sp.textContent = w.t;
            line.appendChild(sp);
          });
          el.appendChild(line);
        });
        capRoot.appendChild(el);
        // kinetic: each word rises out of its mask on its own spoken onset
        kwords.forEach(([node, ws], i) => tl.fromTo(node, { yPercent: 105, opacity: 0, filter: "blur(6px)" },
          { yPercent: 0, opacity: 1, filter: "blur(0px)", duration: 0.32, ease: "power3.out", immediateRender: true }, Math.max(0, ws - 0.04)));
        if (APPLE) {  // soft rise + blur in, quick soft exit that clears before the next card
          const out = Math.min(0.14, (c.e - c.s) * 0.3);
          tl.fromTo(el, { opacity: 0, y: 18, scale: 0.96, filter: "blur(6px)" },
            { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: Math.min(0.26, (c.e - c.s) * 0.45), ease: "power2.out", immediateRender: false }, c.s);
          if (c.key) tl.fromTo(el.querySelectorAll(".k"), { scale: 1 }, { scale: 1.06, duration: 0.35, ease: "power2.out", immediateRender: false }, c.s + 0.05);
          tl.to(el, { opacity: 0, y: -10, filter: "blur(4px)", duration: out, ease: "power2.in" }, c.e - out);
        } else {
          const pop = c.key ? { scale: 1.22, filter: "blur(6px)" } : { scale: 1.08, filter: "blur(0px)" };
          tl.set(el, { opacity: 1 }, c.s);
          tl.fromTo(el, pop, { scale: 1, filter: "blur(0px)", duration: c.key ? 0.14 : 0.07, ease: "power2.out", immediateRender: false }, c.s);
          tl.set(el, { opacity: 0 }, c.e);
        }
        // backlight flash in the keyword colour (Devin's red/green wall glow)
        if (c.key && STYLE.autoFlash !== false) flash(c.s, Math.max(0.5, c.e - c.s), c.key);
      });

      // ---------- camera ----------
      let cur = { s: 1, y: 0 };
      function setCam(s, y, t) {
        tl.set("#cam", { scale: s, y: y * 1920 }, t);
        tl.set("#plate-wrap", { scale: 1 + (s - 1) * 0.45, y: y * 1920 * 0.45 }, t);
        cur = { s, y };
      }
      function push(to, y, t, dur) {
        tl.fromTo("#cam", { scale: cur.s, y: cur.y * 1920 }, { scale: to, y: y * 1920, duration: dur, ease: "sine.inOut", immediateRender: false }, t);
        tl.fromTo("#plate-wrap", { scale: 1 + (cur.s - 1) * 0.45 }, { scale: 1 + (to - 1) * 0.45, duration: dur, ease: "sine.inOut", immediateRender: false }, t);
        cur = { s: to, y };
      }
      function flash(t, dur, c) {
        tl.set("#glow", { "--glow": col(c) }, t);
        tl.fromTo("#glow", { opacity: 0 }, { opacity: STYLE.glowPeak || 0.6, duration: 0.06, immediateRender: false }, t);
        tl.to("#glow", { opacity: 0, duration: Math.min(0.35, dur * 0.4), ease: "power1.in" }, t + dur - Math.min(0.35, dur * 0.4));
      }
      function dim(t, dur) {  // blur + darken the set behind a card (his UI moments)
        if (APPLE) {  // liquid glass shows the footage through it; only a light, slow dim
          tl.fromTo("#world", { filter: "blur(0px) brightness(1)" }, { filter: "blur(3px) brightness(0.8)", duration: 0.5, ease: "sine.inOut", immediateRender: false }, t);
          tl.to("#world", { filter: "blur(0px) brightness(1)", duration: 0.45, ease: "sine.inOut" }, t + dur - 0.45);
          return;
        }
        tl.fromTo("#world", { filter: "blur(0px) brightness(1)" }, { filter: "blur(16px) brightness(0.42)", duration: 0.28, ease: "power2.out", immediateRender: false }, t);
        tl.to("#world", { filter: "blur(0px) brightness(1)", duration: 0.25, ease: "power2.in" }, t + dur - 0.25);
      }
      function inOut(el, t, dur, from) {
        const di = APPLE ? 0.5 : 0.32, dout = APPLE ? 0.3 : 0.22;
        tl.fromTo(el, Object.assign({ opacity: 0 }, from), { opacity: 1, x: 0, y: 0, scale: 1, filter: "blur(0px)", duration: di, ease: APPLE ? "power2.out" : "power3.out", immediateRender: false }, t);
        tl.to(el, { opacity: 0, y: APPLE ? -14 : 0, scale: 0.96, filter: "blur(8px)", duration: dout, ease: "power2.in" }, t + dur - dout);
      }
      const ov = $("overlays");
      const add = (html, cls, style) => { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; if (style) d.setAttribute("style", style); ov.appendChild(d); return d; };
      const esc = (s) => String(s).replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));

      tl.set("#cam", { scale: 1, y: 0 }, 0);
      tl.set("#plate-wrap", { scale: 1, y: 0 }, 0);
      tl.set("#world", { filter: "blur(0px) brightness(1)" }, 0);
      tl.set("#glow", { opacity: STYLE.glowBase || 0 }, 0);

      BEATS.slice().sort((a, b) => a.t - b.t).forEach((b, bi) => {
        const t = b.t, dur = b.dur || 1;
        if (STYLE.smoothCam && ["punch", "zoomblur", "shake"].includes(b.type)) {
          // smooth camera: every reframe becomes a slow sine push, small scale, no blur/shake
          if (b.type !== "shake") push(Math.min(b.scale || 1, STYLE.maxZoom || 1.08), (b.y || 0) * 0.3, t - 0.1, b.dur || STYLE.pushDur || 1.4);
          return;
        }
        switch (b.type) {
          case "punch":   // jump-cut reframe: instant, holds until the next camera beat
            setCam(b.scale || 1.15, b.y || 0, t); break;
          case "push":    // slow push-in / pull-out
            push(b.to || 1.08, b.y || 0, t, dur); break;
          case "zoomblur": {  // whip into the next framing
            tl.fromTo("#cam", { filter: "blur(0px)" }, { filter: "blur(22px)", duration: 0.1, ease: "power2.in", immediateRender: false }, t - 0.1);
            tl.to("#cam", { filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, t);
            setCam(b.scale || 1.25, b.y || 0, t); break;
          }
          case "shake":
            tl.fromTo("#world", { x: -14 }, { x: 0, duration: 0.3, ease: "elastic.out(1.2, 0.3)", immediateRender: false }, t); break;
          case "flash":
            flash(t, dur, b.color); break;
          case "card": {  // floating dark glass card; set blurs + darkens behind it
            dim(t, dur);
            const items = (b.body || []).map((x) => "<li>" + esc(x) + "</li>").join("");
            const el = add("<h3>" + esc(b.title || "") + "</h3><ul>" + items + "</ul>" + (b.img ? '<img src="' + esc(b.img) + '" alt="">' : ""), "glass", "top:" + (b.top || 520) + "px");
            inOut(el, t, dur, { y: 70, scale: 0.92, filter: "blur(10px)" }); break;
          }
          case "media": {  // image card (PiP / example post) with optional title + view count
            let el = b.id ? $(b.id) : null;
            if (!el) {
              const w = b.w || 620, h = b.h || Math.round(w * 16 / 9 * 0.82);
              const left = b.pos === "left" ? 60 : b.pos === "right" ? 1080 - 60 - w : (1080 - w) / 2;
              el = add('<img src="' + esc(b.src) + '" alt="">' + (b.title ? '<div class="title">' + esc(b.title) + "</div>" : "") + (b.views ? '<div class="views">&#9673; ' + esc(b.views) + "</div>" : ""),
                "media", "left:" + left + "px;top:" + (b.top || 330) + "px;width:" + w + "px;height:" + h + "px");
            }
            if (b.dim) dim(t, dur);
            inOut(el, t, dur, { y: 120, scale: 0.85, filter: "blur(14px)" }); break;
          }
          case "toggles": {  // settings list; rows light up and switches flip at b.on[i]
            dim(t, dur);
            const rows = (b.items || []).map((x, i) => '<div class="trow" id="tg' + bi + "-" + i + '"><span>' + esc(x) + '</span><div class="sw" id="sw' + bi + "-" + i + '"><i></i></div></div>').join("");
            const el = add(rows, "toggles", "top:" + (b.top || 640) + "px");
            inOut(el, t, dur, { y: 50, filter: "blur(10px)" });
            (b.on || []).forEach((ot, i) => {
              if (ot == null) return;
              tl.to("#tg" + bi + "-" + i, { borderColor: "#4da3ff", boxShadow: "0 0 30px rgba(77,163,255,0.55)", duration: 0.12 }, ot);
              tl.to("#sw" + bi + "-" + i, { backgroundColor: "#34c759", duration: 0.15 }, ot + 0.1);
              tl.to("#sw" + bi + "-" + i + " i", { x: 44, duration: 0.18, ease: "power2.out" }, ot + 0.1);
            }); break;
          }
          case "tap": {
            const el = add("", "tap", "left:" + b.x + "px;top:" + b.y + "px");
            tl.fromTo(el, { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.14, immediateRender: false }, t - 0.14);
            tl.to(el, { scale: 0.8, duration: 0.08 }, t);
            tl.to(el, { opacity: 0, scale: 1.3, duration: 0.25 }, t + 0.25); break;
          }
          case "comment": {  // CTA: comment box types the keyword and sends
            const word = String(b.word || "CODE");
            const el = add('<div class="av">' + (b.avatar ? '<img src="' + esc(b.avatar) + '" alt="">' : "") + '</div><div class="field"><span>' + word.split("").map((ch, i) => '<b id="cm' + bi + "-" + i + '" style="opacity:0;font-weight:600">' + esc(ch) + "</b>").join("") + '</span><div class="send"><svg width="34" height="34" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg></div></div>', "comment", "top:" + (b.top || 1180) + "px");
            inOut(el, t, dur, { y: 60, scale: 0.9 });
            for (let i = 0; i < word.length; i++) tl.set("#cm" + bi + "-" + i, { opacity: 1 }, t + 0.38 + i * 0.08);
            tl.fromTo(el.querySelector(".send"), { scale: 1 }, { scale: 0.8, duration: 0.08, yoyo: true, repeat: 1, immediateRender: false }, t + 0.4 + word.length * 0.08 + 0.15); break;
          }
          case "kinetic": {  // big kinetic phrase: icon draws, words rise on onsets, Latin words letter-stagger
            const ICONS = {
              shield: "M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3zM8.5 12l2.5 2.5 4.5-5",
              bolt: "M13 2 4 14h7l-1 8 9-12h-7l1-8z",
              chart: "M3 3v18h18M7 15l4-4 3 3 6-7M15 7h5v5",
              spark: "M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8",
              warning: "M12 3 2 21h20L12 3zM12 10v5M12 18v.5",
              building: "M3 21h18M5 21V7l7-4v18M12 21V9l7 3v9M8 9v.5M8 13v.5M8 17v.5M15.5 14v.5M15.5 17v.5",
              brain: "M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a2 2 0 0 0-3-1zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1",
              check: "M4 12.5 9.5 18 20 6",
            };
            const kc = col(b.color || "white");
            const el = add("", "kin", "top:" + (b.top || capY - 10) + "px");
            el.style.setProperty("--kc", kc);
            el.innerHTML = '<div class="kin-shade"></div>' + (b.icon ? '<svg class="kin-icon" viewBox="0 0 24 24"><path pathLength="1" d="' + (ICONS[b.icon] || b.icon) + '"/></svg>' : "");
            tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.18, immediateRender: false }, t - 0.06);
            tl.to(el, { opacity: 0, y: -40, filter: "blur(10px)", duration: 0.35, ease: "power2.in" }, t + dur - 0.35);
            if (b.icon) {
              tl.fromTo(el.querySelector(".kin-icon"), { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, t);
              tl.fromTo(el.querySelector(".kin-icon path"), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut", immediateRender: true }, t + 0.05);
            }
            (b.lines || []).forEach((ln) => {
              const line = document.createElement("div");
              line.className = "kin-line" + (ln.size ? " " + ln.size : "");
              if (ln.words.some((w) => rtl.test(w.t))) line.setAttribute("dir", "rtl");
              ln.words.forEach((w, wi) => {
                if (wi) line.appendChild(document.createTextNode(" "));
                const m = document.createElement("span"); m.className = "kw-mask";
                const inner = document.createElement("span"); inner.className = "kw";
                const latin = !rtl.test(w.t) && w.t.length > 3;
                if (latin) inner.innerHTML = w.t.split("").map((ch) => '<span class="kin-ch">' + esc(ch) + "</span>").join("");
                else inner.textContent = w.t;
                m.appendChild(inner); line.appendChild(m);
                if (latin) tl.fromTo(inner.querySelectorAll(".kin-ch"), { opacity: 0, y: 50, filter: "blur(6px)" },
                  { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out", stagger: 0.035, immediateRender: true }, w.s - 0.03);
                else tl.fromTo(inner, { yPercent: 110, opacity: 0, filter: "blur(8px)" },
                  { yPercent: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out", immediateRender: true }, w.s - 0.05);
              });
              el.appendChild(line);
              if (ln.size === "big") tl.fromTo(line, { scale: 0.94 }, { scale: 1, duration: Math.max(0.6, dur - 0.4), ease: "sine.out", immediateRender: false }, ln.words[0].s);
            });
            break;
          }
          case "notify": {
            const el = add('<div class="ic"></div><div><b>' + esc(b.title || "") + "</b><span>" + esc(b.body || "") + "</span></div><em>now</em>", "notify");
            tl.fromTo(el, { opacity: 0, y: -180 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, t);
            tl.to(el, { opacity: 0, y: -180, duration: 0.3, ease: "power2.in" }, t + dur - 0.3); break;
          }
          case "save": {  // "SAVE THIS FOR LATER" + bookmark
            const el = add('<div class="cap-line">SAVE THIS</div><div class="cap-line">FOR LATER</div><svg width="190" height="230" viewBox="0 0 24 29" style="margin-top:26px;filter:drop-shadow(0 0 22px rgba(255,255,255,.6))"><path d="M3 2h18v25l-9-6-9 6z" fill="#fff"/></svg>', "save", "top:" + (capY - 40) + "px");
            inOut(el, t, dur, { y: 40, scale: 1.15, filter: "blur(8px)" }); break;
          }
        }
      });

      tl.to({}, { duration: D }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
