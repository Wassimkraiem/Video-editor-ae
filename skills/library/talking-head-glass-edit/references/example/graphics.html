      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const q = (s) => "#graphics " + s;
          const popIn = (sel, at, from) =>
            tl.fromTo(q(sel), Object.assign({ opacity: 0, y: -18, scale: 0.92, filter: "blur(6px)" }, from || {}),
              { opacity: 1, y: 0, x: 0, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "power2.out" }, at);
          const out = (sel, at) =>
            tl.to(q(sel), { opacity: 0, y: -14, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, at);

          // hide every group's pieces at t=0
          tl.set(q(".chip, #g-hero, .tile, .price, #g-order, #g-order-h, .row, #g-deliver, #g-end, #g-intro-kick, #g-intro-title, #g-old, #g-save, #g-intro-card, .kw"), { opacity: 0 }, 0);
          popIn("#g-intro-card", 1.6, { y: 16 });
          out("#g-intro-card", 2.32);

          // ── intro 0.25 → 4.3 ──
          tl.fromTo(q("#g-intro-kick"), { opacity: 0, scale: 1.25, filter: "blur(6px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.62);
          popIn("#g-intro-title", 1.66, { y: 24 });
          tl.fromTo(q("#g-intro-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, 1.8);
          out("#g-intro-kick", 2.3);
          out("#g-intro-title", 2.32);
          tl.to(q("#g-intro-rule"), { scaleX: 0, duration: 0.3, ease: "power2.in" }, 2.32);

          // ── features 5.0 → 12.0 ──
          popIn("#g-c1", 5.0, { x: 30 });
          popIn("#g-c2", 5.64, { x: 30 });
          out("#g-c1", 6.38);
          out("#g-c2", 6.4);
          tl.fromTo(q("#g-hero"), { opacity: 0, scale: 0.7, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "power2.out" }, 8.7);
          tl.fromTo(q("#g-hero-sheen"), { x: -200 }, { x: 900, duration: 0.9, ease: "power2.inOut" }, 8.95);
          out("#g-hero", 9.62);
          // big keyword cards — card glides in, each word rises on its spoken onset,
          // gold line sweeps, a slow breathing scale while it holds, soft exit
          const kw = (id, tIn, tA, tB, tOut) => {
            tl.fromTo(q(id), { opacity: 0, scale: 0.86, filter: "blur(12px)" },
              { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, tIn);
            tl.fromTo(q(id + " svg"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, tIn + 0.08);
            tl.fromTo(q(id + "-a"), { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, tA);
            tl.fromTo(q(id + "-b"), { yPercent: 110, opacity: 0, scale: 0.9 }, { yPercent: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, tB);
            tl.fromTo(q(id + "-l"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, tB + 0.05);
            tl.to(q(id + " .kw-t"), { scale: 1.04, duration: Math.max(0.3, tOut - tB), ease: "sine.inOut" }, tB);
            tl.to(q(id), { opacity: 0, scale: 1.06, filter: "blur(10px)", duration: 0.28, ease: "power2.in" }, tOut);
          };
          kw("#g-k1", 9.8, 10.12, 10.62, 10.74);   // اللي يدوم معاك سنين
          kw("#g-k2", 10.98, 10.98, 11.44, 11.72); // وما يلفلفش (kinetic scene wipes in at 11.7)
          kw("#g-k3", 18.6, 18.64, 19.1, 19.45);   // الخامة الممتازة

          // ── price 19.6 → 24.5 ──
          popIn("#g-p1", 19.62, { y: 24 });
          const n1 = { v: 0 };
          tl.fromTo(n1, { v: 0 }, { v: 79, duration: 0.7, ease: "power2.out",
            onUpdate: () => { const el = document.querySelector("#g-p1-n"); if (el) el.textContent = Math.round(n1.v); } }, 19.88);
          popIn("#g-p2", 21.08, { y: 24 });
          const n2 = { v: 0 };
          tl.fromTo(n2, { v: 0 }, { v: 199, duration: 0.6, ease: "power3.out", immediateRender: false,
            onUpdate: () => { const el = document.querySelector("#g-p2-n"); if (el) el.textContent = Math.round(n2.v); } }, 22.32);
                    tl.fromTo(q("#g-old"), { opacity: 0 }, { opacity: 1, duration: 0.25 }, 22.8);
          tl.fromTo(q("#g-old-strike"), { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power2.out" }, 23.0);
          tl.fromTo(q("#g-save"), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 23.2);
          out("#g-p1", 24.3);
