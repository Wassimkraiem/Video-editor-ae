<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      /* the footage plays untouched; only this wrapper scales for the punch-ins */
      #video-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
        transform-origin: 50% 42%;
        will-change: transform;
        backface-visibility: hidden;
      }
      #bg-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="32.766" data-width="1080" data-height="1920">
      <div id="video-wrap">
        <video id="bg-video" src="assets/source.mp4" playsinline data-has-audio="true" data-start="0" data-duration="32.766" data-track-index="0"></video>
      </div>

      <div id="graphics-host" class="layer clip" data-composition-id="graphics" data-composition-src="compositions/graphics.html" data-start="0" data-duration="32.766" data-track-index="1" data-width="1080" data-height="1920"></div>

      <div id="kinetic-host" class="layer clip" data-composition-id="kinetic" data-composition-src="compositions/kinetic.html" data-start="11.7" data-duration="6.3" data-track-index="4" data-width="1080" data-height="1920"></div>

      <div id="captions-host" data-track-kind="captions" class="layer clip" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="32.766" data-track-index="2" data-width="1080" data-height="1920"></div>

      <audio id="sfx" src="assets/sfx.wav" data-start="0" data-duration="32.766" data-track-index="3" data-volume="0.537032"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const V = "#video-wrap";

      // slow, smooth pushes — GPU-composited (force3D) so the frame scales sub-pixel, no jitter
      const push = (from, to, at, dur, first) =>
        tl.fromTo(V, { scale: from }, { scale: to, duration: dur, ease: "sine.inOut", force3D: true, immediateRender: !!first }, at);

      // Z1 — "حتى الولاد يلبسوها"
      push(1, 1.06, 3.0, 1.8, true);
      push(1.06, 1, 4.9, 1.4);
      // Z2 — "haut de gamme"
      push(1, 1.07, 8.4, 1.8);
      push(1.07, 1, 10.3, 1.5);
      // (11.7–18.0 is the full-screen kinetic scene — no zoom needed underneath)
      // Z4 — "pack de trois … ب199"
      push(1, 1.07, 20.6, 2.4);
      push(1.07, 1, 23.3, 1.6);

      tl.to({}, { duration: 32.766 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
